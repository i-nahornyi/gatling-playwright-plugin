name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the full stack trace / Gatling log output if there's an exception.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal simulation to reproduce
      description: A minimal Java/Scala simulation snippet (protocol setup + the action(s) that trigger the bug) that reproduces the issue.
      render: java
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: gatling-playwright-plugin version
      placeholder: "0.1.5"
    validations:
      required: true


  - type: dropdown
    id: build-tool
    attributes:
      label: Build tool
      options:
        - Maven
        - Gradle
        - Other / not sure
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "17"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / Ubuntu 22.04 / macOS 14 ..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant Gatling console/log output. This will be formatted as code automatically.
      render: shell
    validations:
      required: false
