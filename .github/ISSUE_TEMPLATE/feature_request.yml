name: Feature request
description: Suggest an idea, DSL addition, or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the plugin doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? A sketch of the DSL/API (Java and/or Scala) is ideal if this is an API addition.
      render: java
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you considered.
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: gatling-playwright-plugin version
      placeholder: "0.1.5"
    validations:
      required: false
